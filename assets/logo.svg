<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="千颜万花">
  <defs>
    <linearGradient id="qfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa64d"/>
      <stop offset="0.55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#e85d04"/>
    </linearGradient>
  </defs>

  <!-- 六片花瓣：同一形状旋转 6 次，形成六重对称的花 -->
  <g fill="url(#qfGrad)">
    <path d="M32 7 C 41 16 41 26 32 31 C 23 26 23 16 32 7 Z" />
    <path d="M32 7 C 41 16 41 26 32 31 C 23 26 23 16 32 7 Z" transform="rotate(60 32 32)" />
    <path d="M32 7 C 41 16 41 26 32 31 C 23 26 23 16 32 7 Z" transform="rotate(120 32 32)" />
    <path d="M32 7 C 41 16 41 26 32 31 C 23 26 23 16 32 7 Z" transform="rotate(180 32 32)" />
    <path d="M32 7 C 41 16 41 26 32 31 C 23 26 23 16 32 7 Z" transform="rotate(240 32 32)" />
    <path d="M32 7 C 41 16 41 26 32 31 C 23 26 23 16 32 7 Z" transform="rotate(300 32 32)" />
  </g>

  <!-- 花心：留白，让六片花瓣在中间分开，避免糊成一团 -->
  <circle cx="32" cy="32" r="5.4" fill="#ffffff" />
  <circle cx="32" cy="32" r="2.1" fill="#ff7a1a" />
</svg>
