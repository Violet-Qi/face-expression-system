<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弹性动效交互演示</title>
<link rel="stylesheet" href="css/anim.css">
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#eef2ff; display:flex; align-items:center; justify-content:center; height:100vh; }
  .controls { position:fixed; top:16px; left:16px; z-index:999; display:flex; gap:8px; }
  .control-btn {
    padding:10px 16px; border:none; border-radius:var(--radius-md); cursor:pointer;
    font-size:13px; color:#fff; background:linear-gradient(135deg,var(--accent),var(--accent-2));
    transition:transform var(--dur-base) var(--ease-spring-sm), box-shadow var(--dur-fast) var(--ease-decel);
  }
  .control-btn:active { transform:scale(.93); }

  /* 弹窗（触发 fxSpring 强回弹） */
  .modal-layer {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(31,38,135,.25); backdrop-filter:blur(6px); z-index:999;
  }
  .modal-demo {
    width:340px; padding:28px;
    background:rgba(255,255,255,.85); backdrop-filter:blur(24px) saturate(170%);
    border:1px solid rgba(255,255,255,.5); border-radius:var(--radius-xl);
    box-shadow:var(--shadow-lg);
  }

  /* 按钮（触发 fxPress / hover spring） */
  .big-btn {
    width:200px; padding:18px; border:none; border-radius:var(--radius-lg); cursor:pointer;
    font-size:16px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-3),var(--accent-2));
    background-size:200% 100%;
    transition:transform var(--dur-base) var(--ease-spring-sm), box-shadow var(--dur-fast) var(--ease-decel), background-position var(--dur-base) var(--ease-decel);
  }
  .big-btn:hover { background-position:100% 0; transform:translateY(-2px); box-shadow:0 10px 30px rgba(107,124,255,.4); }
  .big-btn:active { transform:scale(.94) translateY(1px); transition-duration:var(--dur-micro); }
</style>
</head>
<body>
  <div class="controls">
    <button class="control-btn" onclick="doSpring()">弹窗落位(spring)</button>
    <button class="control-btn" onclick="doEmphasize()">强调(emphasize)</button>
    <button class="control-btn" onclick="doStagger()">卡片级联</button>
  </div>

  <button class="big-btn" onclick="doSpring()">点击我 · 弹窗落位</button>

  <!-- 弹窗层 -->
  <div class="modal-layer" id="modalLayer">
  <div class="modal-demo" id="modal">
    <h2 style="margin:0 0 8px; font-size:18px;">有质量的弹窗</h2>
    <p style="margin:0; color:#64748b; font-size:14px; line-height:1.6;">
      这个弹窗用 <b>fxSpring</b>（spring-lg 强回弹）——
      它不是简单缩放，而是<u>从上方带着重量落下来</u>，
      到位时会微微过冲再收敛，像真的有质量。
    </p>
    <button style="margin-top:16px;padding:8px 20px;border:none;border-radius:var(--radius-pill);cursor:pointer;background:var(--accent);color:#fff;" onclick="closeModal()">关闭</button>
  </div>
  </div>

<script>
  function doSpring() {
    const layer = document.getElementById('modalLayer');
    const m = document.getElementById('modal');
    layer.style.display = 'flex';
    m.classList.remove('fx-spring'); void m.offsetWidth;
    m.classList.add('fx-spring');
  }
  function closeModal() { document.getElementById('modalLayer').style.display='none'; }
  function doEmphasize() {
    const layer = document.getElementById('modalLayer');
    const m = document.getElementById('modal');
    layer.style.display='flex'; m.classList.remove('fx-emphasize'); void m.offsetWidth; m.classList.add('fx-emphasize');
  }
  function doStagger() {
    const btns = document.querySelectorAll('.control-btn');
    btns.forEach((b,i)=>{ b.classList.remove('fx-stagger-up','fx-delay-'+ (i+1)); void b.offsetWidth; b.classList.add('fx-stagger-up','fx-delay-'+Math.min(i+1,5)); });
  }
</script>
</body>
</html>
